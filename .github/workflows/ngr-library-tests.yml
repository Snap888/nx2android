name: NGR library tests

on:
  push:
    branches: [feature/ngr-universal-launcher]
    paths:
      - 'porter/library.py'
      - 'porter/paths.py'
      - 'tests/test_library.py'
      - '.github/workflows/ngr-library-tests.yml'
  pull_request:
    paths:
      - 'porter/library.py'
      - 'porter/paths.py'
      - 'tests/test_library.py'
      - '.github/workflows/ngr-library-tests.yml'

jobs:
  library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test persistent NGR library
        env:
          NX2A_HOME: ${{ runner.temp }}/ngr-home
        run: python -m unittest discover -s tests -p 'test_library.py' -v
