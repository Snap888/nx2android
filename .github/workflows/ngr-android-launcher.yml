name: NGR Android launcher

on:
  push:
    branches: [feature/ngr-universal-launcher]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/**'
      - '.github/workflows/ngr-android-launcher.yml'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/**'
      - '.github/workflows/ngr-android-launcher.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble NGR launcher
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NGR-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
